[project]
name = "rag-book-chatbot"
version = "0.1.0"
description = "A RAG chatbot for book recommendations using Zilliz vector database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "openai>=1.0.0",
    "pymilvus>=2.4.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
ingest = "src.ingest:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
